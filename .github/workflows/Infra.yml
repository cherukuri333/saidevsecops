name: "ECR-IAM Terraform (Infra Branch)"

on:
  workflow_dispatch:
    inputs:
      tfvars_file:
        description: "Path to the .tfvars file"
        required: true
        default: "dev.tfvars"
      action:
        description: "Terraform Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: sai       # Self-hosted runner label
    if: github.ref == 'refs/heads/Infra'   # Only run on Infra branch

    defaults:
      run:
        shell: bash
        working-directory: ecr-iam   # Folder containing Terraform files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Terraform
        run: terraform -v

      - name: Verify AWS CLI
        run: aws --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        run: terraform plan -var-file=${{ github.event.inputs.tfvars_file }} -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var-file=${{ github.event.inputs.tfvars_file }} -input=false

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve -var-file=${{ github.event.inputs.tfvars_file }} -input=false
