name: Java Build, Test, Trivy Scan & Docker Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: sai   # self-hosted runner

    env:
      AWS_REGION: us-east-1
      ECR_REPO: 143471984294.dkr.ecr.us-east-1.amazonaws.com/sai-dev
      IMAGE_PREFIX: dev

    steps:
      # 🔹 Checkout with full history (required for SonarQube if needed)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 🔹 Verify tool versions
      - name: Verify Versions
        run: |
          java -version
          mvn -version
          docker --version
          trivy --version

      # 🔹 Build & Test Maven project
      - name: Build & Test with Maven
        run: mvn clean package

      # 🔹 Trivy scan on artifact
      - name: Trivy Scan Build Artifact (JAR)
        run: |
          echo "Scanning build artifact..."
          trivy fs target \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            -o trivy-artifact-report.json

      # 🔹 Upload Trivy report
      - name: Upload Trivy Artifact Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-artifact-report
          path: trivy-artifact-report.json

      # 🔹 Configure AWS CLI
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ env.AWS_REGION }}

      # 🔹 Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REPO }}

      # 🔹 Determine next Docker image tag
      - name: Get next ECR tag
        id: ecr_tag
        run: |
          REPO_NAME=sai-dev
          TAGS=$(aws ecr list-images --repository-name $REPO_NAME --query 'imageIds[*].imageTag' --output text | tr '\t' '\n' | grep '^dev-' || true)
          if [ -z "$TAGS" ]; then
            NEXT_TAG="dev-1"
          else
            MAX=$(echo "$TAGS" | sed 's/dev-//' | sort -nr | head -n1)
            NEXT_TAG="dev-$((MAX+1))"
          fi
          echo "Next tag: $NEXT_TAG"
          echo "NEXT_TAG=$NEXT_TAG" >> $GITHUB_ENV

      # 🔹 Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ env.ECR_REPO }}:${{ env.NEXT_TAG }}
          docker build -t $IMAGE_NAME .

      # 🔹 Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          IMAGE_NAME=${{ env.ECR_REPO }}:${{ env.NEXT_TAG }}
          docker push $IMAGE_NAME
