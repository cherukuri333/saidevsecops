name: Java Build, Test, SonarQube & Trivy Artifact Sc

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: sai   # self-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Versions
        run: |
          java -version
          mvn -version
          trivy --version

      # 🔹 Build + Test + Package (single build)
      - name: Build & Test with Maven
        run: mvn clean package

      # 🔹 SonarQube Analysis
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=java-sample-app \
            -Dsonar.host.url=http://34.205.33.83:9000 \
            -Dsonar.login=squ_05f9ab8debfcaec5f4b60640de1cf9cbbf4261ff

      # 🔹 Scan the ACTUAL build artifact
      - name: Trivy Scan Build Artifact (JAR)
        run: |
          echo "Scanning build artifact..."
          trivy fs target \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            -o trivy-artifact-report.json

      # 🔹 Upload report for audit
      - name: Upload Trivy Artifact Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-artifact-report
          path: trivy-artifact-report.json
