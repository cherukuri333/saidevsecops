name: Java Compile, Test, and Trivy Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: sai  # your self-hosted runner

    steps:
      # Step 1: Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Verify Java, Maven, and Trivy versions
      - name: Verify Versions
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version
          echo "Trivy version:"
          trivy --version

      # Step 3: Compile the project
      - name: Compile with Maven
        run: mvn clean compile

      # Step 4: Run Maven tests
      - name: Run Maven tests
        run: mvn test

      # Step 5: Trivy File System Scan (console output + HTML report)
      - name: Trivy FS Scan
        run: |
          echo "Starting Trivy FS scan..."
          # Print results in console
          trivy fs --format table .
          # Generate HTML report
          trivy fs --format html -o trivy-fs-report.html .
          echo "Trivy scan complete. Report generated: trivy-fs-report.html"

      # Step 6: Fail workflow if high/critical vulnerabilities found
      - name: Fail on High/Critical Vulnerabilities
        run: |
          echo "Checking for high or critical vulnerabilities..."
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --quiet .
        continue-on-error: false

      # Step 7: Upload Trivy HTML report as artifact
      - name: Upload Trivy HTML Report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-fs-report
          path: trivy-fs-report.html
