name: Java Build, Test, SonarQube & Trivy Artifact Scan.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: sai   # self-hosted runner

    steps:
      # 🔹 Checkout with full history (required for SonarQube)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔹 Verify tool versions
      - name: Verify Versions
        run: |
          java -version
          mvn -version
          trivy --version

      # 🔹 Build + Test + Package
      - name: Build & Test with Maven
        run: mvn clean package

      # # 🔹 SonarQube Scan
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v5.0.0
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # # 🔹 SonarQube Quality Gate (Pipeline will FAIL if gate fails)
      # - name: SonarQube Quality Gate Check
      #   id: sonarqube-quality-gate-check
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   with:
      #     pollingTimeoutSec: 600
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 🔹 Trivy Scan on build artifact
      - name: Trivy Scan Build Artifact (JAR)
        run: |
          echo "Scanning build artifact..."
          trivy fs target \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            -o trivy-artifact-report.json

      # 🔹 Upload Trivy report
      - name: Upload Trivy Artifact Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-artifact-report
          path: trivy-artifact-report.json
