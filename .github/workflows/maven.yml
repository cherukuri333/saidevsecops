name: Java Compile and Test with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: sai  # your self-hosted runner

    steps:
      # Step 1: Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Verify Java and Maven versions
      - name: Verify Java and Maven
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version

      # Step 3: Compile the project
      - name: Compile with Maven
        run: mvn clean compile

      # Step 4: Run tests
      - name: Run Maven tests
        run: mvn test
